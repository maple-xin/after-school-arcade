<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电脑屏幕嵌入演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#143f48;color:#eee7d5;font-family:system-ui,sans-serif;min-height:100dvh;padding:26px 14px}main{max-width:850px;margin:auto}h1{font-size:22px;font-weight:550;letter-spacing:2px;margin:0 0 10px}p{font-size:12px;color:#adc1b6;line-height:1.8}nav{display:flex;gap:8px;margin:20px 0}button{font:inherit;font-size:12px;padding:10px 16px;color:#eee7d5;border:1px solid #8fa79c66;background:#264f56;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#e7c684;color:#1c4247}.monitor{padding:25px 25px 35px;background:linear-gradient(120deg,#f0e6cd,#b6b29d);border-radius:20px 20px 26px 26px;box-shadow:0 14px 40px #09232c66;border:1px solid #ddd3b8}.glass{border:9px solid #263b3d;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#102b3a}iframe{display:block;width:100%;height:100%;border:0}.foot{display:flex;justify-content:space-between;align-items:center;padding:13px 7px 0;color:#657162;font:10px monospace}.led{width:7px;height:7px;background:#76c5b0;box-shadow:0 0 10px #31c4ac;border-radius:50%}.tip{margin-top:22px}a{color:#efc77b}@media(max-width:500px){.monitor{padding:12px 12px 20px;border-radius:13px}.glass{border-width:5px;border-radius:9px}body{padding:18px 10px}h1{font-size:18px}nav{gap:6px}button{flex:1;padding:10px 8px}}
</style></head><body><main><h1>一块屏幕，三个小游戏。</h1><p>这里使用真实 iframe 嵌入游戏，完整台面会随屏幕尺寸适配。点击游戏后，键盘输入由该屏幕接收。</p><nav aria-label="选择游戏"><button data-game="pinball" aria-pressed="true">弹珠台</button><button data-game="spider" aria-pressed="false">蜘蛛纸牌</button><button data-game="bubble" aria-pressed="false">泡泡龙</button></nav><div class="monitor"><div class="glass"><iframe title="弹珠台游戏" src="./pinball.html?embed=1" allow="fullscreen" allowfullscreen></iframe></div><div class="foot"><span>AFTER SCHOOL · 2001</span><span class="led"></span></div></div><p class="tip">在 Loopit 中，将 iframe 放进电脑插画的屏幕区域即可。<a href="./index.html">打开完整游戏合集 ↗</a></p></main><script>
const frame=document.querySelector('iframe');document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-game]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.src='./'+b.dataset.game+'.html?embed=1';frame.title=b.textContent+'游戏';}));
</script></body></html>
